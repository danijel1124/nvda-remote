name: CI
on:
  push:
    branches: [master, main]
    tags:
      # Client tags only - the server has its own tag namespace
      # (server-vX.Y.Z, see server/CLAUDE.md's Versioning section) and no
      # build artifact of its own, so it must never enter this client
      # build/release path. 'v*' naturally excludes 'server-v*' tags,
      # since they don't start with 'v'.
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: client
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Dependencies
        # polib is needed by scons's gettexttool for compiling .mo
        # translations (site_scons/site_tools/gettexttool) - missing it
        # made every CI run fail before ever reaching the release step.
        run: pip install scons markdown polib
      - name: Run Scons
        run: scons
      - name: Create and Upload Release
        if: contains(github.ref, '/tags/')
        uses: softprops/action-gh-release@v1
        with:
          prerelease: ${{ endsWith(github.ref, '-dev') }}
          files: 'client/*.nvda-addon'
